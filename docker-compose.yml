services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - PORT=4000
      - API_KEY=${API_KEY:-}
    volumes:
      - api_data:/app/data
    ports:
      - "4000:4000"
    restart: unless-stopped

volumes:
  api_data:
