server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A API roda num container separado (service "api" no docker-compose).
    # Fica no mesmo domínio pra não precisar mexer em CORS nem na URL
    # usada pelo frontend (src/lib/api.js usa "/api" relativo).
    #
    # proxy_pass usa uma variável (em vez do host fixo) de propósito: assim o
    # nginx resolve "api" a cada requisição via o DNS interno do Docker, em
    # vez de resolver só uma vez na subida — se resolver no start e o
    # container da API ainda não estiver registrado no DNS, o nginx trava de
    # vez com "host not found in upstream".
    # Sem path nenhum depois do host na variável: assim o nginx NÃO troca o
    # prefixo da location pela URI do proxy_pass (isso só acontece quando o
    # proxy_pass tem uma URI "fixa" no final) — ele só repassa a requisição
    # original (ex: /api/health) direto pro backend, que já espera receber
    # o path completo com "/api" mesmo.
    resolver 127.0.0.11 valid=10s;
    location /api/ {
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA com HashRouter (tudo depois de "#" é só client-side) — não precisa
    # de rewrite pra rotas profundas, mas mantemos por segurança.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
